[project]
name = "bibi-tts"
version = "0.1.0"
requires-python = "==3.12.13"
dependencies = [
    "fastapi>=0.140.0",
    "grpcio>=1.83.0",
    "grpcio-reflection>=1.83.0",
    "piper-tts>=1.6.0",
    "python-multipart>=0.0.32",
    "sounddevice>=0.5.5",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"api/routes.py" = ["B008"]

