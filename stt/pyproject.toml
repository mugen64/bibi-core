[project]
name = "bibi-stt"
version = "0.1.0"
description = "Bibi voice assistant sound to text service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.140.9",
    "grpcio>=1.83.0",
    "grpcio-reflection>=1.83.0",
    "numpy>=2.5.1",
    "python-multipart>=0.0.32",
    "pywhispercpp",
    "uvicorn>=0.51.0",
]

[tool.uv.sources]
pywhispercpp = { git = "https://github.com/absadiki/pywhispercpp" }

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"api/routes.py" = ["B008"]
