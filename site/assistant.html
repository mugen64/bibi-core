<script>
const SEND_SAMPLE_RATE = 16000; // must match what the gateway/stt expects

const el = {
  conversation: document.getElementById('conversation'),
  turns: document.getElementById('turns'),
  emptyHint: document.getElementById('emptyHint'),
  errorBanner: document.getElementById('errorBanner'),
  statusDot: document.getElementById('statusDot'),
  statusText: document.getElementById('statusText'),
  talkBtn: document.getElementById('talkBtn'),
  talkHint: document.getElementById('talkHint'),
  bars: Array.from(document.querySelectorAll('#bars .bar')),
};

// ---------- Connection ----------

let ws = null;
let reconnectTimer = null;
let reconnectDelay = 1000;
const RECONNECT_MAX_DELAY = 10000;

function wsUrl() {
  return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
}

function connect() {
  clearTimeout(reconnectTimer);
  setStatus('connecting', 'CONNECTING…');

  ws = new WebSocket(wsUrl());
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    reconnectDelay = 1000;
    setStatus('connected', 'LIVE');
    setTalkEnabled(true);
    initPlaybackContext();
  };

  ws.onclose = () => {
    setStatus('error', 'RECONNECTING…');
    setTalkEnabled(false);
    stopRecording();
    resetInFlightState();
    ws = null;
    reconnectTimer = setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(RECONNECT_MAX_DELAY, reconnectDelay * 2);
  };

  ws.onerror = () => {
    // onclose follows and drives the reconnect loop
  };

  ws.onmessage = (event) => {
    if (typeof event.data === 'string') {
      handleControlMessage(JSON.parse(event.data));
    } else {
      handleAudioFrame(event.data);
    }
  };
}

function setStatus(state, text) {
  el.statusText.textContent = text;
  el.statusDot.className = 'w-2 h-2 rounded-full transition-colors ' + (
    state === 'connected' ? 'bg-gorse-yellow shadow-[0_0_12px_rgba(255,215,0,0.4)] animate-pulse' :
    state === 'error' ? 'bg-error' :
    'bg-outline-variant'
  );
}

function setTalkEnabled(enabled) {
  // A prior mic permission denial overrides connection state - the button
  // stays disabled regardless, since re-prompting is pointless.
  const active = enabled && !micPermissionDenied;
  el.talkBtn.disabled = !active;
  el.talkBtn.classList.toggle('opacity-40', !active);
  el.talkBtn.classList.toggle('pointer-events-none', !active);
  if (micPermissionDenied) el.talkHint.textContent = 'Microphone access blocked';
  else if (!enabled) el.talkHint.textContent = 'Reconnecting…';
  else if (!recording) el.talkHint.textContent = 'Hold to talk';
}

// A dropped connection shouldn't erase the visible transcript, but any
// turn/utterance that was still in flight is now meaningless - discard
// just that, not the committed history above it.
function resetInFlightState() {
  if (partialWrap) { partialWrap.remove(); partialWrap = null; partialBody = null; }
  closeAssistantTurn(true);
  stopPlayback();
}

// ---------- Control messages ----------

function handleControlMessage(msg) {
  switch (msg.type) {
    case 'partial_transcript':
      updatePartial(msg.text);
      break;
    case 'final_transcript':
      closeAssistantTurn(false);
      commitPartial(msg.text);
      break;
    case 'llm_chunk':
      appendAssistantChunk(msg.text);
      break;
    case 'audio_format':
      playbackFormat = {
        sampleRate: msg.sample_rate || playbackFormat.sampleRate,
        channels: msg.channels || playbackFormat.channels,
        sampleWidth: msg.sample_width || playbackFormat.sampleWidth,
      };
      break;
    case 'interrupted':
      closeAssistantTurn(true);
      stopPlayback();
      break;
    case 'error':
      showError(msg.code, msg.message);
      break;
    default:
      console.debug('unhandled control message', msg);
  }
}

function showError(code, message) {
  el.errorBanner.textContent = `[${code}] ${message}`;
  el.errorBanner.classList.remove('hidden');
  clearTimeout(showError._hideTimer);
  showError._hideTimer = setTimeout(() => el.errorBanner.classList.add('hidden'), 6000);
}

// ---------- Conversation rendering ----------

let turnCount = 0;
let partialWrap = null;
let partialBody = null;
let assistantWrap = null;
let assistantCursorEl = null;
let assistantOpen = false;
let settleTimer = null;

function hideEmptyHint() {
  if (el.emptyHint) { el.emptyHint.remove(); el.emptyHint = null; }
}

function beginTurn() {
  hideEmptyHint();
  if (turnCount > 0) {
    const hr = document.createElement('div');
    hr.className = 'h-px bg-outline-variant';
    el.turns.appendChild(hr);
  }
  turnCount++;
}

function scrollToBottom() {
  el.conversation.scrollTop = el.conversation.scrollHeight;
}

function ensurePartial() {
  if (partialWrap) return;
  beginTurn();
  partialWrap = document.createElement('div');
  partialWrap.className = 'flex flex-col gap-xs';
  partialWrap.innerHTML =
    '<p class="font-label-caps text-label-caps text-on-surface-variant tracking-widest">YOU</p>' +
    '<p class="font-body-lg text-body-lg text-on-surface opacity-60 italic"></p>';
  partialBody = partialWrap.querySelector('p:last-child');
  el.turns.appendChild(partialWrap);
  scrollToBottom();
}

function updatePartial(text) {
  ensurePartial();
  partialBody.textContent = text;
  scrollToBottom();
}

function commitPartial(text) {
  ensurePartial();
  partialBody.textContent = text;
  partialBody.classList.remove('opacity-60', 'italic');
  partialWrap = null;
  partialBody = null;
  scrollToBottom();
}

let assistantSentencesEl = null;

// The gateway sends one 'llm_chunk' per sentence, immediately followed by
// the 'audio_format' + audio frames that speak it (see synthesizeAndSend
// in internal/ws/session.go). pendingSentenceForAudio links the sentence
// element to the *next* audio frame the client receives, so playback
// scheduling (below) can highlight it at the moment it actually starts
// sounding - not when the text/bytes merely arrived over the wire.
let pendingSentenceForAudio = null;
let currentSpeakingEl = null;
let sentenceHighlightTimers = [];

function renderMarkdown(raw) {
  const html = marked.parse(raw, { breaks: true });
  return DOMPurify.sanitize(html);
}

function clearSentenceHighlighting() {
  sentenceHighlightTimers.forEach(clearTimeout);
  sentenceHighlightTimers = [];
  if (currentSpeakingEl) { currentSpeakingEl.classList.remove('speaking'); currentSpeakingEl = null; }
  pendingSentenceForAudio = null;
}

function highlightSentence(sentenceEl) {
  if (currentSpeakingEl) currentSpeakingEl.classList.remove('speaking');
  sentenceEl.classList.add('speaking');
  currentSpeakingEl = sentenceEl;
}

function openAssistantTurn() {
  beginTurn();
  clearSentenceHighlighting();
  assistantWrap = document.createElement('div');
  assistantWrap.className = 'flex flex-col gap-xs';
  assistantWrap.innerHTML =
    '<p class="font-label-caps text-label-caps text-on-surface-variant tracking-widest">BIBI</p>' +
    '<div class="font-body-lg text-body-lg text-on-surface assistant-text flex flex-col gap-1"></div>' +
    '<span class="typing-cursor"></span>';
  assistantSentencesEl = assistantWrap.querySelector('.assistant-text');
  assistantCursorEl = assistantWrap.querySelector('.typing-cursor');
  el.turns.appendChild(assistantWrap);
  assistantOpen = true;
}

function appendAssistantChunk(text) {
  if (!assistantOpen) openAssistantTurn();
  const sentenceEl = document.createElement('div');
  sentenceEl.className = 'assistant-sentence';
  sentenceEl.innerHTML = renderMarkdown(text);
  assistantSentencesEl.appendChild(sentenceEl);
  pendingSentenceForAudio = sentenceEl;
  assistantCursorEl.classList.remove('hidden');
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => assistantCursorEl && assistantCursorEl.classList.add('hidden'), 4000);
  scrollToBottom();
}

function closeAssistantTurn(markStopped) {
  if (!assistantOpen) return;
  clearTimeout(settleTimer);
  clearSentenceHighlighting();
  if (assistantCursorEl) assistantCursorEl.classList.add('hidden');
  if (markStopped && assistantWrap) {
    const marker = document.createElement('span');
    marker.className = 'block font-label-sm text-label-sm text-on-surface-variant mt-xs';
    marker.textContent = '— stopped —';
    assistantWrap.appendChild(marker);
  }
  assistantWrap = null;
  assistantSentencesEl = null;
  assistantCursorEl = null;
  assistantOpen = false;
}

// ---------- Mic capture: resample to 16kHz mono 16-bit PCM ----------
// Uses ScriptProcessorNode for simplicity/broad support. It's deprecated
// in favor of AudioWorklet - fine for a demo, worth migrating to
// AudioWorklet if this becomes a real product client.

let audioCtx = null;
let micStream = null;
let sourceNode = null;
let processorNode = null;
let recording = false;
let lastRms = 0;
let micPermissionDenied = false;

async function startRecording() {
  if (recording || micPermissionDenied || !ws || ws.readyState !== WebSocket.OPEN) return;

  // getUserMedia only exists in a secure context (HTTPS or localhost).
  // Over plain HTTP on any other host, navigator.mediaDevices is
  // undefined and the call below would throw before ever prompting -
  // catch that up front so we can say why, instead of a generic
  // "Microphone unavailable" that leaves users guessing.
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    micPermissionDenied = true;
    el.talkBtn.classList.add('opacity-40', 'pointer-events-none');
    const reason = window.isSecureContext
      ? 'Microphone not supported in this browser'
      : 'Microphone needs HTTPS';
    el.talkHint.textContent = reason;
    showError('mic_insecure_context', window.isSecureContext
      ? 'This browser does not support microphone capture.'
      : 'Microphone access requires HTTPS (or localhost). Load this page over HTTPS to talk to BiBi.');
    return;
  }

  recording = true;
  el.talkBtn.classList.add('bg-surface-container-high', 'border-primary');
  el.talkHint.textContent = 'Listening… release to send';
  ws.send(JSON.stringify({ type: 'start' }));

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    recording = false;
    el.talkBtn.classList.remove('bg-surface-container-high', 'border-primary');
    // We already told the gateway a turn started - it has no audio coming
    // and no other way to find out, so tell it to close the STT stream
    // rather than leaving it open indefinitely.
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'end_utterance' }));
    }
    // Browsers don't re-prompt after a denial - retrying just fails again
    // silently, so stop offering it instead of leaving a dead button.
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      micPermissionDenied = true;
      el.talkBtn.classList.add('opacity-40', 'pointer-events-none');
      el.talkHint.textContent = 'Microphone access blocked';
      showError('mic_denied', 'Microphone access was denied. Enable it in your browser/site settings to talk to BiBi.');
    } else {
      el.talkHint.textContent = 'Microphone unavailable';
      showError('mic_unavailable', 'Could not access the microphone.');
    }
    return;
  }

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  sourceNode = audioCtx.createMediaStreamSource(micStream);

  const bufferSize = 4096;
  processorNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);

  processorNode.onaudioprocess = (e) => {
    if (!recording) return; // guards against a callback already queued before teardown
    const input = e.inputBuffer.getChannelData(0);

    let sum = 0;
    for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
    lastRms = Math.sqrt(sum / input.length);

    const resampled = downsampleTo16k(input, audioCtx.sampleRate, SEND_SAMPLE_RATE);
    const pcm16 = floatTo16BitPCM(resampled);
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(pcm16.buffer);
    }
  };

  sourceNode.connect(processorNode);
  processorNode.connect(audioCtx.destination);
  ensureRafLoop();
}

function stopRecording() {
  if (!recording) return;
  recording = false;
  lastRms = 0;
  el.talkBtn.classList.remove('bg-surface-container-high', 'border-primary');
  el.talkBtn.style.boxShadow = '';
  el.talkBtn.style.transform = '';
  el.talkHint.textContent = ws && ws.readyState === WebSocket.OPEN ? 'Hold to talk' : 'Reconnecting…';

  if (processorNode) { processorNode.disconnect(); processorNode = null; }
  if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'end_utterance' }));
  }
}

function downsampleTo16k(buffer, fromRate, toRate) {
  if (fromRate === toRate) return buffer;
  const ratio = fromRate / toRate;
  const newLength = Math.round(buffer.length / ratio);
  const result = new Float32Array(newLength);
  for (let i = 0; i < newLength; i++) {
    result[i] = buffer[Math.floor(i * ratio)];
  }
  return result;
}

function floatTo16BitPCM(input) {
  const output = new Int16Array(input.length);
  for (let i = 0; i < input.length; i++) {
    const s = Math.max(-1, Math.min(1, input[i]));
    output[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return output;
}

// ---------- Playback: queue TTS audio chunks in order ----------

let playbackCtx = null;
let playbackQueueTime = 0;
let analyser = null;
let freqData = null;
let scheduledSourceCount = 0;
let isSpeaking = false;
let activeSources = [];
let playbackFormat = { sampleRate: 22050, channels: 1, sampleWidth: 2 };

function initPlaybackContext() {
  if (playbackCtx) return;
  playbackCtx = new (window.AudioContext || window.webkitAudioContext)();
  playbackQueueTime = playbackCtx.currentTime;

  analyser = playbackCtx.createAnalyser();
  analyser.fftSize = 64;
  analyser.smoothingTimeConstant = 0.7;
  analyser.connect(playbackCtx.destination); // connected once, ever
  freqData = new Uint8Array(analyser.frequencyBinCount);
}

function handleAudioFrame(arrayBuffer) {
  if (!playbackCtx) initPlaybackContext();

  const pcm16 = new Int16Array(arrayBuffer);
  const float32 = new Float32Array(pcm16.length);
  for (let i = 0; i < pcm16.length; i++) {
    float32[i] = pcm16[i] / 0x8000;
  }

  const audioBuffer = playbackCtx.createBuffer(playbackFormat.channels || 1, float32.length, playbackFormat.sampleRate || 22050);
  audioBuffer.getChannelData(0).set(float32);

  const source = playbackCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(analyser); // tap for the visualization; analyser->destination carries the sound

  // Schedule strictly after whatever's already queued, so chunks play
  // back-to-back in arrival order rather than overlapping.
  const startAt = Math.max(playbackQueueTime, playbackCtx.currentTime);

  // pendingSentenceForAudio is set once, right when the sentence's text
  // arrives - this frame is its first chunk of audio, so startAt is when
  // that sentence actually begins sounding (not when this frame merely
  // arrived over the wire, which can be well ahead of playback).
  if (pendingSentenceForAudio) {
    const sentenceEl = pendingSentenceForAudio;
    pendingSentenceForAudio = null;
    const delayMs = Math.max(0, (startAt - playbackCtx.currentTime) * 1000);
    sentenceHighlightTimers.push(setTimeout(() => highlightSentence(sentenceEl), delayMs));
  }

  source.start(startAt);
  playbackQueueTime = startAt + audioBuffer.duration;

  scheduledSourceCount++;
  if (scheduledSourceCount === 1) setSpeaking(true);
  activeSources.push(source);
  source.onended = () => {
    activeSources = activeSources.filter((s) => s !== source);
    scheduledSourceCount = Math.max(0, scheduledSourceCount - 1);
    if (scheduledSourceCount === 0) setSpeaking(false);
  };

  ensureRafLoop();
}

function stopPlayback() {
  activeSources.forEach((s) => { s.onended = null; try { s.stop(); } catch (e) {} });
  activeSources = [];
  scheduledSourceCount = 0;
  setSpeaking(false);
  if (playbackCtx) playbackQueueTime = playbackCtx.currentTime;
}

function setSpeaking(speaking) {
  isSpeaking = speaking;
  if (!speaking) restBars();
  else ensureRafLoop();
}

// ---------- Visualization: shared rAF loop for speaking bars + mic glow ----------

let rafId = null;

function ensureRafLoop() {
  if (rafId) return;
  rafId = requestAnimationFrame(tick);
}

function tick() {
  if (isSpeaking && analyser) {
    analyser.getByteFrequencyData(freqData);
    updateBars(freqData);
  }
  if (recording) {
    applyMicGlow(lastRms);
  }
  if (isSpeaking || recording) {
    rafId = requestAnimationFrame(tick);
  } else {
    rafId = null;
  }
}

function updateBars(data) {
  const binsPerBar = Math.floor(data.length / el.bars.length) || 1;
  for (let i = 0; i < el.bars.length; i++) {
    let sum = 0;
    const start = i * binsPerBar;
    for (let j = start; j < start + binsPerBar; j++) sum += data[j] || 0;
    const avg = sum / binsPerBar;
    const bar = el.bars[i];
    bar.style.height = (4 + (avg / 255) * 28) + 'px';
    bar.classList.remove('opacity-30');
    bar.classList.add('opacity-100');
  }
}

function restBars() {
  el.bars.forEach((bar) => {
    bar.style.height = '4px';
    bar.classList.remove('opacity-100');
    bar.classList.add('opacity-30');
  });
}

function applyMicGlow(rms) {
  const intensity = Math.min(0.6, rms * 2);
  const blur = 8 + rms * 160;
  el.talkBtn.style.boxShadow = `0 0 ${blur}px rgba(255,215,0,${intensity})`;
  el.talkBtn.style.transform = `scale(${1 + Math.min(0.08, rms * 0.3)})`;
}

// ---------- Controls ----------

el.talkBtn.addEventListener('mousedown', startRecording);
el.talkBtn.addEventListener('mouseup', stopRecording);
el.talkBtn.addEventListener('mouseleave', () => { if (recording) stopRecording(); });

el.talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); }, { passive: false });
el.talkBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); }, { passive: false });
el.talkBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); stopRecording(); }, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat && !el.talkBtn.disabled) {
    e.preventDefault();
    startRecording();
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    stopRecording();
  }
});

setTalkEnabled(false);
connect();
</script>
